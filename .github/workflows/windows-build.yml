name: Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist:win
      - name: Verify the downloaded ZIP layout and launch
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "tyranoforge-release"
          Expand-Archive -LiteralPath dist/TyranoForge-Windows-x64.zip -DestinationPath $destination
          $env:TYRANOFORGE_PACKAGE_FOLDER = Join-Path $destination "TyranoForge-win32-x64"
          node scripts/verify-package.js win32
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TyranoForge-Windows-x64
          path: |
            dist/TyranoForge-Windows-x64.zip
            dist/TyranoForge-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7
